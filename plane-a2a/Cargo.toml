# busbar-plane-a2a: the A2A plane. Its door (`plane_door::door`) over the A2A codec it carries (the
# `a2a` module: the JSON-RPC, HTTP+JSON and gRPC lines); the cdylib twin `busbar-plane-a2a-plugin`
# exports the same door.
[package]
name = "busbar-plane-a2a"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The A2A plane for busbar: the plugin contract's plane kind over the A2A protocol's JSON-RPC, HTTP+JSON and gRPC lines."
# THE ROOT CELLS' ADDRESS: `build.rs` states `cells=<this crate>/tests/root/mod.rs` under this
# `links` name, and the composition root's `build.rs` reads it as `DEP_BUSBAR_DOOR_CELLS_<CRATE>_CELLS`
# (the same for a path dependency and a pinned one), so the root compiles this plane's own root cells
# without naming this crate or resolving its checkout. Links no native library.
links = "busbar-door-cells-busbar-plane-a2a"

[lints]
workspace = true

[lib]
name = "busbar_plane_a2a"
path = "src/lib.rs"

# NO FEATURES, ON PURPOSE. A plane compiled two ways is two planes, and the kernel would have no way
# to tell which one it registered. The contract crate holds itself to the same rule and asserts it.

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { workspace = true }
# The two wire parameter objects the canonicalizer and the frame rewriter read and write
# derive their shapes; the dialect folded in here (#39) and brought its own serde need with it.
serde = { workspace = true }
# The object notation the codec speaks. The adapter hands values across the seam and never invents
# a second parser.
serde_json = { workspace = true }
# The wiped buffers a push_config record's value passes through (it carries the caller's webhook
# credential).
zeroize = { workspace = true }
# The `agents:` section keeps its registrations in the order an operator wrote them.
indexmap = { workspace = true, features = ["serde"] }
# The deployment's `public_url`, read once into the absolute URLs the plane publishes.
url = { workspace = true }
# The frame reader's one diagnostic goes out through the contract's `diag_warn!`, which expands to
# `tracing`.
tracing = { workspace = true }
# THE gRPC LINE (ARCHITECT rulings on FOLD-A2A, 2026-10-04, Q1 (C)): the a2aproject's service
# messages, generated at build time from the vendored `proto/a2a.proto` (`build.rs`), decoded and
# encoded with `prost`, which also writes the error model's `google.rpc.Status` details; their
# ProtoJSON mapping is pbjson's (`pbjson`; the well-known types are the plane's own, `src/wkt.rs`).
prost = { workspace = true, features = ["derive"] }
pbjson = { workspace = true }
# The gRPC line's status details, written as gRPC writes a binary field (unpadded base64).
base64 = { workspace = true }

[build-dependencies]
# The message and ProtoJSON code generators `build.rs` runs, and the protoc they drive.
prost-build = { workspace = true }
pbjson-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { workspace = true, features = ["test-seal"] }
# `busbar_test_kit::alloc_counter` is the counting `GlobalAlloc` the allocation gates install
# (ARCHITECT ruling 2026-10-21; busbar #1830 moved it out of busbar-contract): dev-only, so the
# crate root keeps the literal `#![forbid(unsafe_code)]`.
busbar-test-kit = { workspace = true }
