# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-plane-a2a-plugin"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party signed kind:plane plugin cdylib: the a2a plane, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."

[lints]
workspace = true

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door` is the door this image exports. A busbar build that
# LINKS the plane names the logic crate, which exports no symbol.
busbar-plane-a2a = { path = "../plane-a2a" }
busbar-contract = { workspace = true }

[dev-dependencies]
# Ordinary admission, privacy, and both-image tests use the production loader.
busbar-plugin-loader = { workspace = true , features = ["test-support"] }
# The ordinary host-log test uses production host services and a fixed read-only row adapter.
busbar-kernel = { workspace = true }
# The both-ways op-by-op script (`tests/both_ways.rs`, moved here with the crate from busbar's
# crates/busbar-plane-a2a) reads the door's answers as JSON.
serde_json = { workspace = true }
# ABI fixtures use the contract's existing low-level input and seal primitives.
busbar-contract = { workspace = true, features = ["test-seal", "test-support"] }
futures = { workspace = true }
